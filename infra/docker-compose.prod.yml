# Прод: наружу смотрит только nginx (80). Остальные сервисы доступны
# друг другу по имени сервиса во внутренней сети compose (postgres:5432,
# redis:6379, backend:3001, frontend:3000).
#
# Секреты берутся из infra/.env (не в git):
#   POSTGRES_PASSWORD=...
#   REDIS_PASSWORD=...
# Запуск: docker compose -f docker-compose.prod.yml up -d --build

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Только localhost сервера: подключиться можно через SSH-туннель,
    # из интернета порт не виден.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *default-logging

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: crm-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env.production
    # Адреса БД и Redis задаются здесь, а не в .env.production:
    # внутри контейнера localhost — это сам контейнер.
    environment:
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD}@postgres:5432/crm
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  # Тот же образ, что у backend, но запускает BullMQ-воркер вместо API.
  # entrypoint переопределён, чтобы миграции гонял только backend.
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: crm-backend
    restart: unless-stopped
    entrypoint: ["node", "dist/src/worker/imports.worker.js"]
    env_file:
      - ../backend/.env.production
    environment:
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD}@postgres:5432/crm
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    logging: *default-logging

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
